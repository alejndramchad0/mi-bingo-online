<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BINGO PL - Cartones Online</title>
  <style>
    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      font-family: 'Arial Black', 'Impact', sans-serif;
      text-align: center;
      color: #ffffff;
      margin: 0;
      padding: 15px 10px;
      min-height: 100vh;
      background-color: #0b1a3e;
      position: relative;
    }

    /* Imagen de fondo semitransparente que NO bloquea clics */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('1000030946.png');
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
      opacity: 0.25;
      z-index: 0;
      pointer-events: none; /* Esto evita que el fondo intercepte los clics */
    }

    .main-container {
      position: relative;
      z-index: 10;
    }

    .brand-title {
      font-size: 2.2rem;
      margin: 5px 0 2px 0;
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 3px 8px rgba(0,0,0,0.9), 0 0 15px rgba(255, 215, 0, 0.5);
    }

    .subtitle {
      font-size: 0.9rem;
      color: #ffffff;
      margin-bottom: 15px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
      font-weight: normal;
      font-family: sans-serif;
      padding: 0 10px;
    }

    /* Caja de Búsqueda */
    .search-box {
      margin: 0 auto 15px auto;
      width: 100%;
      max-width: 360px;
      background: rgba(10, 25, 60, 0.95);
      padding: 12px;
      border-radius: 14px;
      border: 2px solid #ffd700;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }

    .search-inputs {
      display: flex;
      gap: 8px;
    }

    .search-box input {
      flex: 1;
      padding: 12px 8px;
      font-size: 1rem;
      border: 2px solid #ffffff;
      border-radius: 8px;
      background: #ffffff;
      color: #000000;
      outline: none;
      text-align: center;
      font-weight: bold;
    }

    .search-box button {
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 900;
      border: none;
      border-radius: 8px;
      background: linear-gradient(180deg, #ffd700 0%, #ff8c00 100%);
      color: #000000;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
      text-transform: uppercase;
    }

    .search-box button:active {
      transform: scale(0.95);
    }

    .search-hint {
      font-size: 0.75rem;
      color: #cbd5e1;
      font-family: sans-serif;
      line-height: 1.2;
      margin-top: 8px;
    }

    /* Contenedor Principal de Cartones */
    .cards-wrapper {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      margin-top: 15px;
    }

    /* Cartón Individual */
    .card-container {
      width: 100%;
      max-width: 350px;
    }

    .marquee-header {
      background: #c00d1e;
      border: 3px solid #ff4d4d;
      border-radius: 12px 12px 0 0;
      padding: 6px 10px;
      box-shadow: 0 0 12px rgba(192, 13, 30, 0.7);
    }

    .marquee-title {
      font-size: 1.25rem;
      color: #ffffff;
      text-shadow: 2px 2px 4px #000;
      margin: 0;
      text-transform: uppercase;
    }

    .card-frame {
      background: rgba(192, 13, 30, 0.95);
      border: 3px solid #ffd700;
      border-top: none;
      border-radius: 0 0 16px 16px;
      padding: 8px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.7);
    }

    .card {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      background: #ffffff;
      padding: 6px;
      border-radius: 10px;
    }

    .cell {
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      padding: 12px 0;
      font-weight: 900;
      font-size: 1.1rem;
      cursor: pointer;
      user-select: none;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
    }

    .cell.header {
      background: linear-gradient(180deg, #ffd700 0%, #f59e0b 100%);
      color: #000000;
      font-size: 1.2rem;
      border: none;
      cursor: default;
    }

    /* Ficha Marcada */
    .cell.marked {
      background: radial-gradient(circle at 30% 30%, #ff4d4d, #990000) !important;
      color: #ffffff !important;
      border-color: #660000 !important;
      border-radius: 50%;
      box-shadow: inset 0 -2px 4px rgba(0,0,0,0.4), 0 2px 5px rgba(0,0,0,0.3);
      text-shadow: 1px 1px 2px #000;
    }

    .cell.free {
      background: #22c55e;
      color: #ffffff;
      font-size: 0.75rem;
      border: none;
    }

    /* Acciones */
    .actions {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .btn-bingo {
      background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
      color: #ffffff;
      border: 2px solid #86efac;
      padding: 10px 24px;
      font-size: 1.1rem;
      font-weight: 900;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.5);
      text-transform: uppercase;
      width: 100%;
      max-width: 280px;
    }

    .btn-reset {
      background: rgba(255,255,255,0.2);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.4);
      padding: 8px 16px;
      font-size: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
