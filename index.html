<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BINGO PL</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      text-align: center;
      background: #0b1a3e;
      color: #ffffff;
      margin: 0;
      padding: 15px 10px;
    }
    .brand-title {
      font-size: 2.2rem;
      color: #ffd700;
      margin: 10px 0 5px 0;
      font-family: 'Impact', sans-serif;
    }
    .subtitle {
      font-size: 0.9rem;
      margin-bottom: 15px;
      color: #e2e8f0;
    }
    .search-box {
      background: #1e293b;
      padding: 12px;
      border-radius: 12px;
      border: 2px solid #ffd700;
      max-width: 360px;
      margin: 0 auto 15px auto;
    }
    .search-inputs {
      display: flex;
      gap: 6px;
    }
    input {
      flex: 1;
      padding: 10px;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      text-align: center;
      font-weight: bold;
    }
    button {
      padding: 10px 15px;
      font-size: 1rem;
      font-weight: bold;
      background: #ffd700;
      color: #000;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .cards-wrapper {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }
    .card-container {
      width: 100%;
      max-width: 340px;
      background: #c00d1e;
      border: 3px solid #ffd700;
      border-radius: 12px;
      padding: 8px;
    }
    .marquee-title {
      margin: 5px 0;
      font-size: 1.2rem;
      color: #fff;
    }
    .card {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      background: #fff;
      padding: 6px;
      border-radius: 8px;
    }
    .cell {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 10px 0;
      font-weight: bold;
      font-size: 1rem;
      color: #0f172a;
      border-radius: 4px;
    }
    .cell.header {
      background: #ffd700;
      color: #000;
    }
    .cell.marked {
      background: #c00d1e !important;
      color: #fff !important;
      border-radius: 50%;
    }
    .cell.free {
      background: #22c55e;
      color: #fff;
    }
    .btn-reset {
      background: rgba(255,255,255,0.2);
      color: #fff;
      border: 1px solid #fff;
      padding: 8px 15px;
      border-radius: 6px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <h1 class="brand-title">BINGO PL</h1>
  <div class="subtitle">Ingresa tu número de cartón (Ej: 5 o 3, 8)</div>

  <div class="search-box">
    <div class="search-inputs">
      <input type="text" id="numCarton" placeholder="N° de Cartón">
      <button type="button" id="btnBuscar">BUSCAR</button>
    </div>
  </div>

  <div id="panel" style="display:none;">
    <button class="btn-reset" onclick="limpiarMarcas()">Limpiar Marcas</button>
    <div id="cards-wrapper" class="cards-wrapper"></div>
  </div>

  <script>
    function pseudoRandom(seed) {
      let value = seed;
      return function() {
        value = (value * 9301 + 49297) % 233280;
        return value / 233280;
      };
    }

    function obtenerNumeros(min, max, cantidad, rng) {
      const nums = [];
      while (nums.length < cantidad) {
        const n = Math.floor(rng() * (max - min + 1)) + min;
        if (!nums.includes(n)) nums.push(n);
      }
      return nums;
    }

    function generarCarton(num) {
      const wrapper = document.getElementById("cards-wrapper");
      const rng = pseudoRandom(num);

      const container = document.createElement("div");
      container.className = "card-container";
      container.innerHTML = <h3 class="marquee-title">Cartón #${num}</h3><div class="card" id="c-${num}"></div>;
      wrapper.appendChild(container);

      const grid = document.getElementById(c-${num});
      const headers = ['B', 'I', 'N', 'G', 'O'];
      headers.forEach(h => {
        const div = document.createElement("div");
        div.className = "cell header";
        div.innerText = h;
        grid.appendChild(div);
      });

      const cols = [
        obtenerNumeros(1, 15, 5, rng),
        obtenerNumeros(16, 30, 5, rng),
        obtenerNumeros(31, 45, 5, rng),
        obtenerNumeros(46, 60, 5, rng),
        obtenerNumeros(61, 75, 5, rng)
      ];

      for (let f = 0; f < 5; f++) {
        for (let c = 0; c < 5; c++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          if (f === 2 && c === 2) {
            cell.innerText = "LIBRE";
            cell.classList.add("free", "marked");
          } else {
            cell.innerText = cols[c][f];
            cell.onclick = function() { this.classList.toggle("marked"); };
          }
          grid.appendChild(cell);
        }
      }
    }

    document.getElementById("btnBuscar").onclick = function() {
      const input = document.getElementById("numCarton").value.trim();
      if (!input) {
        alert("Escribe al menos un número.");
        return;
      }

      const wrapper = document.getElementById("cards-wrapper");
      wrapper.innerHTML = "";
      document.getElementById("panel").style.display = "block";

      const partes = input.split(",");
      partes.forEach(p => {
        const n = parseInt(p.trim());
        if (!isNaN(n) && n > 0) {
          generarCarton(n);
        }
      });
    };

    function limpiarMarcas() {
      const celdas = document.querySelectorAll(".cell:not(.header):not(.free)");
      celdas.forEach(c => c.classList.remove("marked"));
    }
  </script>

</body>
</html>
